# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name merrain.cn www.merrain.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Cloudflare Tunnel 当前通过 80 端口访问这些独立服务。
    location /ncm/ {
        proxy_pass http://127.0.0.1:1888/;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store";
    }

    location /download/flowtide/ {
        alias /var/www/flowtide/;
        add_header Cache-Control "no-cache";
    }

    location /download/hackathon/ {
        alias /var/www/hackathon/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        add_header Cache-Control "no-cache";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主站
server {
    listen 443 ssl http2;
    server_name merrain.cn www.merrain.cn;

    ssl_certificate /etc/letsencrypt/live/merrain.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/merrain.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    location /_next/static {
        alias /home/ubuntu/myblogger/.next/static;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location /ncm/ {
        proxy_pass http://127.0.0.1:1888/;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store";
    }

    location /download/flowtide/ {
        alias /var/www/flowtide/;
        add_header Cache-Control "no-cache";
    }

    location /download/hackathon/ {
        alias /var/www/hackathon/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        add_header Cache-Control "no-cache";
    }

    # 敏感 API 必须经过 Next.js 鉴权，且禁止任何中间缓存。
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    # 动态页面和 RSC 请求不进入共享缓存，避免 HTML/RSC 缓存键混用。
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store, max-age=0" always;
        add_header Vary "RSC, Next-Router-State-Tree, Next-Router-Prefetch, Next-Url, Accept" always;
    }

    location /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }
}
