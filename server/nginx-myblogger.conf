# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name merrain.cn www.merrain.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /hermes/ {
        alias /home/ubuntu/myblogger/public/hermes/;
        expires 1d;
        add_header Cache-Control "public";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主站
server {
    listen 443 ssl http2;
    server_name merrain.cn www.merrain.cn;

    ssl_certificate /etc/letsencrypt/live/merrain.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/merrain.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    location /_next/static {
        alias /home/ubuntu/myblogger/.next/static;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location /hermes/ {
        alias /home/ubuntu/myblogger/public/hermes/;
        expires 1d;
        add_header Cache-Control "public";
    }

    location /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
